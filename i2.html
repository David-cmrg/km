<!DOCTYPE html>

<html lang="de">

<head>
  <title>KlausurenManager | David Gomez C.</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Der KlausurenManager unterstützt Lehrkräfte mit einer digitalen Uhr, einem konfigurierbaren Timer und einer Notizfunktion für die Durchführung von Prüfungen.">
  <meta name="keywords" content="KlausurenManager, Prüfungsaufsicht Tool, Timer für Lehrer, digitale Uhr Prüfung, Lehrer Zeitmanagement, Schulprüfung Timer, Prüfungsassistent, digitales Tool für Lehrer, Humboldt Schule Wiesbaden">
  <meta name="author" content="David Gomez C.">
  <meta name="robots" content="index, follow">

  <meta property="og:title" content="KlausurenManager – Digitaler Prüfungsassistent für Lehrkräfte" />
  <meta property="og:description" content="Mit integrierter Uhr, Timer und Schreibfläche ist der Klausurenmanager die perfekte Lösung für die Prüfungsaufsicht." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://km.cmrg.site" />
  <meta property="og:image" content="https://david-cmrg.github.io/KlausurenManager/bilder/open_graph_vorschau.png" />
  <meta property="og:site_name" content="KlausurenManager">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="KlausurenManager – Digitaler Prüfungsassistent für Lehrkräfte">
  <meta name="twitter:description" content="Lehrkräfte erhalten mit Klausurenmanager ein minimalistisches, hilfreiches Tool für Prüfungsaufsicht.">
  <meta name="twitter:image" content="https://david-cmrg.github.io/KlausurenManager/bilder/open_graph_vorschau.png">

  <link rel="icon" href="bilder/open_graph-vorschau.ico" type="image/x-icon">
  <link rel="icon" href="bilder/open_graph-vorschau.png" type="image/png">
  <link rel="apple-touch-icon" href="bilder/apple-touch-icon.png" sizes="180x180">

  <!-- Montserrat local -->

  <style>
    @font-face { font-display: swap; font-family: 'Montserrat'; font-style: normal; font-weight: 100; src: url('fonts/Montserrat/montserrat-v31-latin-100.woff2') format('woff2'); }
    @font-face { font-display: swap; font-family: 'Montserrat'; font-style: normal; font-weight: 200; src: url('fonts/Montserrat/montserrat-v31-latin-200.woff2') format('woff2'); }
    @font-face { font-display: swap; font-family: 'Montserrat'; font-style: normal; font-weight: 300; src: url('fonts/Montserrat/montserrat-v31-latin-300.woff2') format('woff2'); }
    @font-face { font-display: swap; font-family: 'Montserrat'; font-style: normal; font-weight: 400; src: url('fonts/Montserrat/montserrat-v31-latin-regular.woff2') format('woff2'); }
    @font-face { font-display: swap; font-family: 'Montserrat'; font-style: normal; font-weight: 500; src: url('fonts/Montserrat/montserrat-v31-latin-500.woff2') format('woff2'); }
    @font-face { font-display: swap; font-family: 'Montserrat'; font-style: normal; font-weight: 600; src: url('fonts/Montserrat/montserrat-v31-latin-600.woff2') format('woff2'); }
    @font-face { font-display: swap; font-family: 'Montserrat'; font-style: normal; font-weight: 700; src: url('fonts/Montserrat/montserrat-v31-latin-700.woff2') format('woff2'); }
    @font-face { font-display: swap; font-family: 'Montserrat'; font-style: normal; font-weight: 800; src: url('fonts/Montserrat/montserrat-v31-latin-800.woff2') format('woff2'); }
    @font-face { font-display: swap; font-family: 'Montserrat'; font-style: normal; font-weight: 900; src: url('fonts/Montserrat/montserrat-v31-latin-900.woff2') format('woff2'); }
  </style>

  <style>
    /* ═══════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      color: white;
    }
    html, body {
      min-height: 100vh;
      background-color: #1a0808;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* ═══════════════════════════════════════════
       FONT SIZE SCALE  (set via JS on <html>)
       data-fontscale="compact" | "normal" | "large"
    ═══════════════════════════════════════════ */
    :root { --fs-scale: 1; }
    html[data-fontscale="compact"] { --fs-scale: 0.78; }
    html[data-fontscale="normal"]  { --fs-scale: 1;    }
    html[data-fontscale="large"]   { --fs-scale: 1.28; }

    /* ═══════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════ */
    #HeaderSeparator {
      width: 100%;
      text-align: center;
      padding: 3.5vh 0 2.5vh;
    }
    .siteHeader {
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      font-weight: 600;
    }

    /* ═══════════════════════════════════════════
       LAYOUT
    ═══════════════════════════════════════════ */
    #contentWrapper {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: clamp(12px, 2vw, 28px);
      width: 100%;
      padding: 0 clamp(12px, 3vw, 32px) clamp(16px, 2vh, 28px);
      flex: 1;
    }
    #leftColumn {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* ═══════════════════════════════════════════
       GLASS CARD
    ═══════════════════════════════════════════ */
    #clockAndTimer {
      width: clamp(270px, 29vw, 370px);
      border-radius: 32px;
      position: relative;
      isolation: isolate;
      box-shadow: 0 6px 24px rgba(0,0,0,.25);
      padding: clamp(20px, 2.5vw, 32px) clamp(22px, 3vw, 34px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    #clockAndTimer::before {
      content: '';
      position: absolute; inset: 0; z-index: 0;
      border-radius: 32px;
      box-shadow: inset 0 0 15px -6px #ffffff;
      background-color: rgba(255,255,255,0);
      pointer-events: none;
    }
    #clockAndTimer::after {
      content: '';
      position: absolute; inset: 0; z-index: -1;
      border-radius: 32px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      pointer-events: none;
    }
    #clockAndTimer > * { position: relative; z-index: 1; width: 100%; }

    /* ═══════════════════════════════════════════
       DATE
    ═══════════════════════════════════════════ */
    #Datum {
      font-size: calc(clamp(14px, 1.4vw, 17px) * var(--fs-scale));
      font-weight: 600;
      letter-spacing: .06em;
      padding-bottom: clamp(12px, 1.8vh, 20px);
      text-align: center;
    }

    /* ═══════════════════════════════════════════
       SECTION LABELS
    ═══════════════════════════════════════════ */
    .section-label {
      text-align: left;
      font-size: calc(clamp(10px, 1.1vw, 13px) * var(--fs-scale));
      font-weight: 600;
      letter-spacing: .12em;
      opacity: .75;
      margin-bottom: 4px;
    }

    /* ═══════════════════════════════════════════
       CLOCK
    ═══════════════════════════════════════════ */
    #Clock { width: 100%; margin-bottom: clamp(16px, 2.2vh, 26px); }
    .clock-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 5px;
    }
    #clockTimeMain {
      font-size: calc(clamp(2.8rem, 7vw, 5.5rem) * var(--fs-scale));
      font-weight: 300;
      letter-spacing: -.02em;
      line-height: 1;
    }
    #clockTimeSeconds {
      font-size: calc(clamp(1.1rem, 2.2vw, 2.4rem) * var(--fs-scale));
      font-weight: 300;
      opacity: .65;
      margin-bottom: 3px;
    }

    /* ═══════════════════════════════════════════
       TIMER
    ═══════════════════════════════════════════ */
    #Timer { width: 100%; }
    .time-setter {
      display: flex;
      gap: clamp(12px, 2.2vw, 26px);
      justify-content: center;
      margin-top: 6px;
    }
    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .unit > span {
      font-size: calc(clamp(1.7rem, 4vw, 3.4rem) * var(--fs-scale));
      font-weight: 300;
      min-width: 2ch;
      text-align: center;
      line-height: 1.1;
    }
    .unit > div {
      font-size: calc(clamp(10px, 1.1vw, 13px) * var(--fs-scale));
      opacity: .7;
      letter-spacing: .05em;
    }

    /* ═══════════════════════════════════════════
       +/- BUTTONS
    ═══════════════════════════════════════════ */
    .addTime, .remTime {
      width: clamp(30px, 2.4vw, 38px);
      height: clamp(30px, 2.4vw, 38px);
      border-radius: 50%;
      position: relative; isolation: isolate;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
      display: flex; align-items: center; justify-content: center;
      border: none; background: none; cursor: pointer;
      font-size: calc(clamp(17px, 1.8vw, 24px) * var(--fs-scale));
      transition: transform .2s ease, background-color .2s ease;
      padding: 0;
    }
    .addTime:focus, .remTime:focus { outline: none; }
    .addTime::before {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      box-shadow: inset 0 0 16px -6px rgba(0,255,55,.45);
      background-color: rgba(255,255,255,0); pointer-events: none;
    }
    .remTime::before {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      box-shadow: inset 0 0 16px -6px rgba(255,0,0,.4);
      background-color: rgba(255,255,255,0); pointer-events: none;
    }
    .addTime::after, .remTime::after {
      content: ''; position: absolute; inset: 0; z-index: -1; border-radius: 50%;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .addTime:hover, .remTime:hover { background-color: rgba(255,255,255,.18); transform: scale(1.08); }
    .addTime { color: #5fff85; }
    .remTime { color: #ff7070; }

    /* ═══════════════════════════════════════════
       CONTROLS ROW
    ═══════════════════════════════════════════ */
    #controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 1.8vw, 20px);
      margin-top: clamp(16px, 2.2vh, 26px);
      position: relative;
    }

    /* START / STOPP */
    #toggle {
      position: relative;
      background: none; border: none; cursor: pointer;
      color: white;
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: calc(clamp(13px, 1.4vw, 17px) * var(--fs-scale));
      font-weight: 600;
      letter-spacing: .1em;
      padding: 2px 16px;
      min-width: 76px;
    }
    #toggle::after {
      content: '';
      position: absolute; bottom: 0; left: 0;
      width: 100%; height: 1px;
      background: #fff; border-radius: 1px;
      transition: transform .4s ease;
    }
    #toggle:hover::after { transform: scaleX(1.1); }

    /* SVG icon side-buttons */
    .ctrl-btn {
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,.75);
      width: 34px; height: 34px;
      padding: 4px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: color .2s, transform .2s, background-color .18s;
      line-height: 1; position: relative;
      flex-shrink: 0;
    }
    .ctrl-btn svg { width: 100%; height: 100%; display: block; }
    .ctrl-btn:hover { color: #fff; transform: scale(1.12); background-color: rgba(255,255,255,.1); }
    .ctrl-btn:focus { outline: none; }

    /* ═══════════════════════════════════════════
       PRESET DROPDOWN  (right side)
    ═══════════════════════════════════════════ */
    #presetWrapper { position: relative; }

    #presetDropdown {
      position: absolute;
      bottom: calc(100% + 10px);
      right: 0;                   /* anchored to right edge of button */
      display: none;
      flex-direction: column;
      gap: 6px;
      background: rgba(25, 8, 8, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 16px;
      padding: 10px 8px;
      min-width: 120px;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      z-index: 200;
    }
    #presetDropdown.open { display: flex; }
    #presetDropdown::after {
      content: '';
      position: absolute;
      bottom: -6px; right: 11px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid rgba(255,255,255,.15);
    }
    .preset-item {
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,.9);
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: clamp(12px, 1.2vw, 14px);
      font-weight: 500;
      letter-spacing: .05em;
      padding: 7px 14px;
      border-radius: 10px;
      text-align: center;
      transition: background .18s ease;
      white-space: nowrap;
    }
    .preset-item:hover { background: rgba(255,255,255,.15); }

    /* ═══════════════════════════════════════════
       SETTINGS PANEL  (left side, slides up)
    ═══════════════════════════════════════════ */
    #settingsWrapper { position: relative; }

    #settingsPanel {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 0;                    /* anchored to left edge of button */
      display: none;
      flex-direction: column;
      gap: 4px;
      background: rgba(25, 8, 8, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 18px;
      padding: 14px 12px;
      min-width: 210px;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      z-index: 200;
    }
    #settingsPanel.open { display: flex; }
    #settingsPanel::after {
      content: '';
      position: absolute;
      bottom: -6px; left: 11px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid rgba(255,255,255,.15);
    }

    /* Settings title */
    .settings-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      opacity: .5;
      padding: 0 6px 6px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      margin-bottom: 4px;
    }

    /* Settings row */
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 10px;
      transition: background .15s;
    }
    .settings-row:hover { background: rgba(255,255,255,.07); }

    .settings-row-label {
      font-size: 13px;
      font-weight: 500;
      opacity: .9;
      white-space: nowrap;
    }

    /* Font size segmented control */
    .seg-ctrl {
      display: flex;
      gap: 3px;
      background: rgba(0,0,0,.25);
      border-radius: 8px;
      padding: 3px;
    }
    .seg-btn {
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,.6);
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      transition: background .15s, color .15s;
      letter-spacing: .03em;
    }
    .seg-btn.active {
      background: rgba(255,255,255,.22);
      color: #fff;
    }

    /* Toggle switch */
    .toggle-sw {
      position: relative;
      width: 38px; height: 22px;
      flex-shrink: 0;
    }
    .toggle-sw input {
      opacity: 0; width: 0; height: 0; position: absolute;
    }
    .toggle-track {
      position: absolute; inset: 0;
      background: rgba(255,255,255,.18);
      border-radius: 22px;
      cursor: pointer;
      transition: background .25s;
    }
    .toggle-sw input:checked + .toggle-track { background: rgba(100,220,120,.7); }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform .25s;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    .toggle-sw input:checked + .toggle-track::after { transform: translateX(16px); }

    /* Danger button (reset) */
    .settings-danger-btn {
      background: rgba(255,80,80,.12);
      border: 1px solid rgba(255,80,80,.3);
      color: rgba(255,160,160,.9);
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .05em;
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: background .18s, border-color .18s;
      margin-top: 4px;
    }
    .settings-danger-btn:hover {
      background: rgba(255,80,80,.22);
      border-color: rgba(255,80,80,.55);
      color: #fff;
    }

    /* ═══════════════════════════════════════════
       FOOTER
    ═══════════════════════════════════════════ */
    footer {
      text-align: center;
      font-size: clamp(11px, 1vw, 13px);
      opacity: .75;
    }
    footer a { color: rgba(255,255,255,.85); text-decoration: none; transition: color .2s; }
    footer a:hover { color: #fff; opacity: 1; }
    footer .sep { margin: 0 .6rem; opacity: .4; }

    /* ═══════════════════════════════════════════
       IFRAME
    ═══════════════════════════════════════════ */
    #iframeWrapper {
      flex: 1; min-width: 0;
      display: flex; align-items: stretch;
      padding-bottom: clamp(12px, 2vh, 20px);
    }
    #tldrawFrame {
      width: 100%;
      min-height: clamp(420px, 72vh, 900px);
      border: none; border-radius: 16px; display: block;
    }

    /* ═══════════════════════════════════════════
       RESPONSIVE ≤ 767px
    ═══════════════════════════════════════════ */
    @media (max-width: 767px) {
      #contentWrapper { flex-direction: column; align-items: center; padding: 0 12px 16px; }
      #leftColumn { width: 100%; max-width: 420px; }
      #clockAndTimer { width: 100%; }
      #iframeWrapper { width: 100%; padding-bottom: 12px; }
      #tldrawFrame { min-height: 60vh; border-radius: 14px; }
      #clockTimeMain  { font-size: calc(clamp(2.6rem, 13vw, 4.2rem) * var(--fs-scale)); }
      #clockTimeSeconds { font-size: calc(clamp(1.1rem, 5vw, 1.8rem) * var(--fs-scale)); }
      .unit > span { font-size: calc(clamp(1.8rem, 8vw, 2.6rem) * var(--fs-scale)); }
      .addTime, .remTime { width: 34px; height: 34px; }
      /* On mobile panels open downward so they stay on screen */
      #presetDropdown, #settingsPanel {
        top: calc(100% + 10px);
        bottom: auto;
      }
      #presetDropdown::after, #settingsPanel::after {
        top: -6px; bottom: auto;
        border-top: none;
        border-bottom: 6px solid rgba(255,255,255,.15);
      }
    }
    @media (max-width: 420px) { .time-setter { gap: 14px; } }
  </style>

</head>

<body id="background-body">

  <!-- Header -->

  <div id="HeaderSeparator">
    <h1 class="siteHeader">KlausurenManager</h1>
  </div>

  <div id="contentWrapper">


<!-- Left column: card + footer -->
<div id="leftColumn">

  <div id="clockAndTimer">

    <h3 class="section-label" id="Datum">HEUTIGES DATUM</h3>

    <!-- Clock -->
    <div id="Clock">
      <h5 class="section-label">UHRZEIT</h5>
      <div class="clock-row">
        <span id="clockTimeMain">00:00</span>
        <span id="clockTimeSeconds">00</span>
      </div>
    </div>

    <!-- Timer -->
    <div id="Timer">
      <h5 class="section-label" style="margin-top: clamp(8px,1.2vh,14px);">TIMER</h5>
      <div class="time-setter">
        <div class="unit">
          <button onclick="changeTime('hours',1)"    class="addTime" aria-label="Stunden erhöhen">+</button>
          <span id="hours">00</span>
          <button onclick="changeTime('hours',-1)"   class="remTime" aria-label="Stunden verringern">-</button>
          <div>Stunden</div>
        </div>
        <div class="unit">
          <button onclick="changeTime('minutes',1)"  class="addTime" aria-label="Minuten erhöhen">+</button>
          <span id="minutes">00</span>
          <button onclick="changeTime('minutes',-1)" class="remTime" aria-label="Minuten verringern">-</button>
          <div>Minuten</div>
        </div>
        <div class="unit">
          <button onclick="changeTime('seconds',1)"  class="addTime" aria-label="Sekunden erhöhen">+</button>
          <span id="seconds">00</span>
          <button onclick="changeTime('seconds',-1)" class="remTime" aria-label="Sekunden verringern">-</button>
          <div>Sekunden</div>
        </div>
      </div>

      <div id="controls">

        <!-- LEFT: Settings button (inline SVG gear — no import needed) -->
        <div id="settingsWrapper">
          <button class="ctrl-btn" id="settingsBtn" aria-label="Einstellungen" title="Einstellungen">
            <!-- Heroicons: cog-6-tooth  (MIT licence, inline) -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

  <!-- ═══════════════════════════════════════════════
       JAVASCRIPT
  ═══════════════════════════════════════════════ -->

  <script>
    /* ──────────────────────────────────────────────
       AUDIO  — AudioContext created on first START press
       (required by browser autoplay policy)
    ────────────────────────────────────────────── */
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      /* Resume in case browser suspended it */
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playAlarm() {
      const alarmEnabled = document.getElementById('alarmToggle').checked;
      if (!alarmEnabled || !audioCtx) return;

      /* Resume just in case */
      audioCtx.resume().then(() => {
        /* Gentle descending chime: G4 → E4 → C4 */
        const notes = [
          { freq: 392.0, start: 0.0,  dur: 1.3 },
          { freq: 329.6, start: 0.55, dur: 1.3 },
          { freq: 261.6, start: 1.1,  dur: 2.0 },
        ];
        notes.forEach(({ freq, start, dur }) => {
          const osc  = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const t    = audioCtx.currentTime;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t + start);
          gain.gain.setValueAtTime(0, t + start);
          gain.gain.linearRampToValueAtTime(0.35, t + start + 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, t + start + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t + start);
          osc.stop(t + start + dur + 0.05);
        });
      });
    }

    /* ──────────────────────────────────────────────
       TIMER
    ────────────────────────────────────────────── */
    let h = 0, m = 0, s = 0;
    let countdown = null;
    let running = false;

    function updateDisplay() {
      document.getElementById("hours").textContent   = String(h).padStart(2,"0");
      document.getElementById("minutes").textContent = String(m).padStart(2,"0");
      document.getElementById("seconds").textContent = String(s).padStart(2,"0");
    }

    function changeTime(unit, delta) {
      if (running) return;
      if (unit === 'hours')   h = Math.max(0, Math.min(99, h + delta));
      if (unit === 'minutes') m = Math.max(0, Math.min(59, m + delta));
      if (unit === 'seconds') s = Math.max(0, Math.min(59, s + delta));
      updateDisplay();
    }

    function applyPreset(minutes) {
      if (running) return;
      h = Math.floor(minutes / 60);
      m = minutes % 60;
      s = 0;
      updateDisplay();
      closePreset();
    }

    function tick() {
      let total = h * 3600 + m * 60 + s;
      if (total <= 0) {
        clearInterval(countdown);
        countdown = null;
        running = false;
        document.getElementById("toggle").textContent = "START";
        playAlarm();
        return;
      }
      total--;
      h = Math.floor(total / 3600);
      m = Math.floor((total % 3600) / 60);
      s = total % 60;
      updateDisplay();
    }

    function resetTimer() {
      clearInterval(countdown);
      countdown = null;
      running = false;
      h = 0; m = 0; s = 0;
      updateDisplay();
      document.getElementById("toggle").textContent = "START";
      closeSettings();
    }

    function addOneMinute() {
      let total = h * 3600 + m * 60 + s + 60;
      h = Math.floor(total / 3600);
      m = Math.floor((total % 3600) / 60);
      s = total % 60;
      updateDisplay();
    }

    document.getElementById("toggle").addEventListener("click", function () {
      if (!running) {
        if (h * 3600 + m * 60 + s <= 0) return;
        initAudio();           /* ← initialise AudioContext on user gesture */
        countdown = setInterval(tick, 1000);
        running = true;
        this.textContent = "STOPP";
      } else {
        clearInterval(countdown);
        countdown = null;
        running = false;
        this.textContent = "START";
      }
    });

    updateDisplay();

    /* ──────────────────────────────────────────────
       PRESET DROPDOWN
    ────────────────────────────────────────────── */
    const presetBtn      = document.getElementById("presetBtn");
    const presetDropdown = document.getElementById("presetDropdown");

    function closePreset() { presetDropdown.classList.remove("open"); }

    presetBtn.addEventListener("click", function(e) {
      e.stopPropagation();
      closeSettings();
      presetDropdown.classList.toggle("open");
    });

    /* ──────────────────────────────────────────────
       SETTINGS PANEL
    ────────────────────────────────────────────── */
    const settingsBtn   = document.getElementById("settingsBtn");
    const settingsPanel = document.getElementById("settingsPanel");

    function closeSettings() { settingsPanel.classList.remove("open"); }

    settingsBtn.addEventListener("click", function(e) {
      e.stopPropagation();
      closePreset();
      settingsPanel.classList.toggle("open");
    });

    /* Close both panels on outside click */
    document.addEventListener("click", function(e) {
      if (!presetDropdown.contains(e.target) && e.target !== presetBtn)   closePreset();
      if (!settingsPanel.contains(e.target)  && e.target !== settingsBtn) closeSettings();
    });

    /* ──────────────────────────────────────────────
       SETTINGS: FONT SIZE
    ────────────────────────────────────────────── */
    function setFontScale(scale) {
      document.documentElement.setAttribute('data-fontscale', scale);
      document.querySelectorAll('.seg-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.scale === scale);
      });
    }

    /* ──────────────────────────────────────────────
       SETTINGS: BACKGROUND TOGGLE
    ────────────────────────────────────────────── */
    let vantaEffect = null;

    function toggleBackground(enabled) {
      if (enabled) {
        /* Re-initialise Vanta if it was destroyed */
        if (typeof VANTA !== 'undefined' && !vantaEffect) {
          vantaEffect = VANTA.WAVES({
            el: "html",
            mouseControls: false, touchControls: false, gyroControls: true,
            minHeight: 200, minWidth: 200, scale: 1, scaleMobile: 1,
            color: 0x331515, shininess: 150, waveHeight: 40, waveSpeed: 0.35, zoom: 0.65
          });
        }
      } else {
        if (vantaEffect) { vantaEffect.destroy(); vantaEffect = null; }
      }
    }
  </script>

  <!-- ── Clock JS ──────────────────────────────────────── -->

  <script>
    const WEEKDAYS = ["SONNTAG","MONTAG","DIENSTAG","MITTWOCH","DONNERSTAG","FREITAG","SAMSTAG"];

    function updateClock() {
      const now = new Date();
      document.getElementById("clockTimeMain").textContent =
        String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
      document.getElementById("clockTimeSeconds").textContent =
        String(now.getSeconds()).padStart(2,"0");
    }
    function updateDate() {
      const now = new Date();
      document.getElementById("Datum").textContent =
        WEEKDAYS[now.getDay()] + ", " +
        String(now.getDate()).padStart(2,"0") + "/" +
        String(now.getMonth()+1).padStart(2,"0") + "/" +
        now.getFullYear();
    }
    setInterval(updateClock, 1000);
    updateClock();
    updateDate();
  </script>
