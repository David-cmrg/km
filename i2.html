    *, *::before, *::after {

      margin: 0; padding: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      color: white;
    }

      border-radius: 32px;
      position: relative;
      isolation: isolate;
      box-shadow: 0 6px 24px rgba(0,0,0,.25);
      /* FIX 2: more generous padding to give text room to breathe */

      background-color: rgba(255,255,255,0); pointer-events: none;
    }
    .addTime::after, .remTime::after {
      content: ''; position: absolute; inset: 0; z-index: -1; border-radius: 50%;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);

    .remTime { color: #ff7070; }

  <!-- ── JS ─────────────────────────────────────────────── -->

  <script>
    /* ---------- Timer state ---------- */
    let h = 0, m = 0, s = 0;
    let countdown = null;
    let running = false;

    function updateDisplay() {
      document.getElementById("hours").textContent   = String(h).padStart(2,"0");
      document.getElementById("minutes").textContent = String(m).padStart(2,"0");
      document.getElementById("seconds").textContent = String(s).padStart(2,"0");
    }

    function changeTime(unit, delta) {
      if (running) return;
      if (unit === 'hours')   h = Math.max(0, Math.min(99, h + delta));
      if (unit === 'minutes') m = Math.max(0, Math.min(59, m + delta));
      if (unit === 'seconds') s = Math.max(0, Math.min(59, s + delta));
      updateDisplay();
    }

    /* FIX 3: Preset function */
    function applyPreset(minutes) {
      if (running) return;
      h = Math.floor(minutes / 60);
      m = minutes % 60;
      s = 0;
      updateDisplay();
      closePreset();
    }

    function tick() {
      let total = h * 3600 + m * 60 + s;
      if (total <= 0) {
        clearInterval(countdown);
        countdown = null;
        running = false;
        document.getElementById("toggle").textContent = "START";
        playAlarm(); /* FIX 3: smooth alarm */
        return;
      }
      total--;
      h = Math.floor(total / 3600);
      m = Math.floor((total % 3600) / 60);
      s = total % 60;
      updateDisplay();
    }

    function resetTimer() {
      clearInterval(countdown);
      countdown = null;
      running = false;
      h = 0; m = 0; s = 0;
      updateDisplay();
      document.getElementById("toggle").textContent = "START";
    }

    function addOneMinute() {
      let total = h * 3600 + m * 60 + s + 60;
      h = Math.floor(total / 3600);
      m = Math.floor((total % 3600) / 60);
      s = total % 60;
      updateDisplay();
    }

    document.getElementById("toggle").addEventListener("click", function () {
      if (!running) {
        if (h * 3600 + m * 60 + s <= 0) return;
        countdown = setInterval(tick, 1000);
        running = true;
        this.textContent = "STOPP";
      } else {
        clearInterval(countdown);
        countdown = null;
        running = false;
        this.textContent = "START";
      }
    });

    updateDisplay();

    /* ---------- FIX 3: Preset dropdown toggle ---------- */
    const presetBtn = document.getElementById("presetBtn");
    const presetDropdown = document.getElementById("presetDropdown");

    function closePreset() { presetDropdown.classList.remove("open"); }

    presetBtn.addEventListener("click", function(e) {
      e.stopPropagation();
      presetDropdown.classList.toggle("open");
    });

    document.addEventListener("click", function(e) {
      if (!presetDropdown.contains(e.target) && e.target !== presetBtn) {
        closePreset();
      }
    });

    /* ---------- FIX 3: Smooth alarm sound ---------- */
    function playAlarm() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();

        /* A gentle 3-note chime: G4 → E4 → C4, each fading out softly */
        const notes = [
          { freq: 392.0, start: 0.0,  dur: 1.2 },   /* G4 */
          { freq: 329.6, start: 0.55, dur: 1.2 },   /* E4 */
          { freq: 261.6, start: 1.1,  dur: 1.8 },   /* C4 */
        ];

        notes.forEach(({ freq, start, dur }) => {
          const osc  = ctx.createOscillator();
          const gain = ctx.createGain();
          const now  = ctx.currentTime;

          /* Sine wave for a warm, bell-like tone */
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + start);

          /* Smooth attack + long fade out — no harsh clicks */
          gain.gain.setValueAtTime(0, now + start);
          gain.gain.linearRampToValueAtTime(0.38, now + start + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + start + dur);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + start);
          osc.stop(now + start + dur + 0.05);
        });
      } catch(e) { /* AudioContext not available */ }
    }
  </script>

  <script>
    const WEEKDAYS = ["SONNTAG","MONTAG","DIENSTAG","MITTWOCH","DONNERSTAG","FREITAG","SAMSTAG"];

    function updateClock() {
      const now = new Date();
      document.getElementById("clockTimeMain").textContent =
        String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
      document.getElementById("clockTimeSeconds").textContent =
        String(now.getSeconds()).padStart(2,"0");
    }

    function updateDate() {
      const now = new Date();
      const day   = String(now.getDate()).padStart(2,"0");
      const month = String(now.getMonth() + 1).padStart(2,"0");
      document.getElementById("Datum").textContent =
        WEEKDAYS[now.getDay()] + ", " + day + "/" + month + "/" + now.getFullYear();
    }

    setInterval(updateClock, 1000);
    updateClock();
    updateDate();
  </script>
