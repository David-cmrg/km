  <style>
    /* ── Reset ─────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      color: white;
    }

    html, body {
      min-height: 100vh;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      /* ── Fallback: verhindert weiße Seite wenn Vanta.js nicht lädt ── */
      background-color: #1a0808;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* ── Header ────────────────────────────────────────── */
    #HeaderSeparator {
      width: 100%;
      text-align: center;
      padding: 3.5vh 0 2vh;
    }

    .siteHeader {
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      font-weight: 600;
      text-align: center;
    }

    /* ── Main layout ───────────────────────────────────── */
    /* Desktop: side-by-side  |  Mobile: stacked */
    #contentWrapper {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: clamp(12px, 2vw, 28px);
      width: 100%;
      padding: 0 clamp(12px, 3vw, 32px);
      flex: 1;
    }

    /* ── Glass card (clock + timer) ────────────────────── */
    #clockAndTimer {
      flex-shrink: 0;
      width: clamp(260px, 28vw, 360px);
      border-radius: 32px;
      position: relative;
      isolation: isolate;
      box-shadow: 0 6px 24px rgba(0,0,0,.25);
      padding: clamp(16px, 2vw, 24px) clamp(18px, 2.5vw, 28px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    #clockAndTimer::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: 32px;
      box-shadow: inset 0 0 15px -6px #ffffff;
      background-color: rgba(255,255,255,0);
      pointer-events: none;
    }
    #clockAndTimer::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: 32px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      pointer-events: none;
    }
    #clockAndTimer > * { position: relative; z-index: 1; width: 100%; }

    /* ── Date ──────────────────────────────────────────── */
    #Datum {
      font-size: clamp(11px, 1.2vw, 15px);
      font-weight: 600;
      letter-spacing: .06em;
      padding-bottom: clamp(10px, 1.5vh, 18px);
      text-align: center;
    }

    /* ── Clock ─────────────────────────────────────────── */
    #Clock {
      width: 100%;
      margin-bottom: clamp(14px, 2vh, 22px);
    }
    .section-label {
      padding: 0 !important;
      margin: 0 0 0 0.15em !important;
      text-align: left;
      font-size: clamp(9px, 1vw, 12px);
      font-weight: 600;
      letter-spacing: .1em;
      opacity: .75;
    }
    .clock-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 4px;
    }
    #clockTimeMain {
      font-size: clamp(2.2rem, 6vw, 4.8rem);
      font-weight: 300;
      letter-spacing: -.02em;
      line-height: 1;
    }
    #clockTimeSeconds {
      font-size: clamp(.9rem, 1.8vw, 2rem);
      font-weight: 300;
      opacity: .65;
      margin-bottom: 2px;
    }

    /* ── Timer ─────────────────────────────────────────── */
    #Timer { width: 100%; }

    .time-setter {
      display: flex;
      gap: clamp(10px, 2vw, 22px);
      justify-content: center;
      margin-top: 6px;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .unit > span {
      font-size: clamp(1.4rem, 3.5vw, 3rem);
      font-weight: 300;
      min-width: 2ch;
      text-align: center;
      line-height: 1.1;
    }

    .unit > div {
      font-size: clamp(9px, 1vw, 11px);
      opacity: .7;
      letter-spacing: .05em;
      text-align: center;
    }

    /* +/- buttons */
    .addTime, .remTime {
      width: clamp(28px, 2.2vw, 36px);
      height: clamp(28px, 2.2vw, 36px);
      border-radius: 50%;
      position: relative;
      isolation: isolate;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      cursor: pointer;
      font-size: clamp(16px, 1.6vw, 22px);
      transition: transform .2s ease, background-color .2s ease;
      padding: 0;
    }
    .addTime:focus, .remTime:focus { outline: none; }

    .addTime::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: inset 0 0 16px -6px rgba(0,255,55,.45);
      background-color: rgba(255,255,255,0);
      pointer-events: none;
    }
    .remTime::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: inset 0 0 16px -6px rgba(255,0,0,.4);
      background-color: rgba(255,255,255,0);
      pointer-events: none;
    }
    .addTime::after, .remTime::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: 50%;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .addTime:hover, .remTime:hover {
      background-color: rgba(255,255,255,.18);
      transform: scale(1.08);
    }
    .addTime { color: #5fff85; }
    .remTime { color: #ff7070; }

    /* Controls row */
    #controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 1.5vw, 18px);
      margin-top: clamp(14px, 2vh, 22px);
    }

    /* START/STOPP button */
    #toggle {
      position: relative;
      background: none;
      border: none;
      cursor: pointer;
      color: white;
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: clamp(13px, 1.3vw, 16px);
      font-weight: 600;
      letter-spacing: .08em;
      padding: 2px 14px;
      min-width: 72px;
    }
    #toggle::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 1px;
      background: #fff;
      border-radius: 1px;
      transition: transform .4s ease;
    }
    #toggle:hover::after { transform: scaleX(1.1); }

    /* Reset & +1min icon buttons */
    .ctrl-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,.75);
      font-size: clamp(16px, 1.6vw, 22px);
      padding: 4px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .2s, transform .2s;
      line-height: 1;
    }
    .ctrl-btn:hover { color: #fff; transform: scale(1.12); }
    .ctrl-btn:focus { outline: none; }

    /* ── tldraw iframe ─────────────────────────────────── */
    #iframeWrapper {
      flex: 1;
      min-width: 0;             /* prevents flex overflow */
      display: flex;
      align-items: stretch;
      padding-bottom: clamp(12px, 2vh, 20px);
    }

    #tldrawFrame {
      width: 100%;
      height: 100%;
      min-height: clamp(400px, 68vh, 800px);
      border: none;
      border-radius: 16px;
      display: block;
    }

    /* ── Footer ────────────────────────────────────────── */
    footer {
      width: 100%;
      text-align: center;
      padding: clamp(10px, 1.5vh, 18px) 0 clamp(14px, 2vh, 22px);
      font-size: clamp(11px, 1vw, 13px);
    }
    footer a {
      color: rgba(255,255,255,.8);
      text-decoration: none;
      transition: color .2s;
    }
    footer a:hover { color: #fff; }
    footer .sep { margin: 0 .6rem; opacity: .5; }

    /* ── Responsive: ≤ 767px ───────────────────────────── */
    @media (max-width: 767px) {
      #contentWrapper {
        flex-direction: column;
        align-items: center;
        padding: 0 12px;
      }

      #clockAndTimer {
        width: 100%;
        max-width: 420px;
      }

      #iframeWrapper {
        width: 100%;
        padding-bottom: 12px;
      }

      #tldrawFrame {
        min-height: 60vh;
        border-radius: 14px;
      }

      #clockTimeMain { font-size: clamp(2.4rem, 12vw, 4rem); }
      #clockTimeSeconds { font-size: clamp(1rem, 4vw, 1.6rem); }
      .unit > span { font-size: clamp(1.6rem, 7vw, 2.4rem); }
      .addTime, .remTime { width: 34px; height: 34px; font-size: 18px; }
      #toggle { font-size: 14px; }
    }

    /* ── Responsive: ≤ 420px ───────────────────────────── */
    @media (max-width: 420px) {
      .time-setter { gap: 14px; }
      .unit > span { font-size: 1.8rem; }
    }
  </style>

  <!-- ── Timer & Clock JS ─────────────────────────────── -->

  <script>
    let h = 0, m = 0, s = 0;
    let countdown = null;
    let running = false;

    function updateDisplay() {
      document.getElementById("hours").textContent   = String(h).padStart(2, "0");
      document.getElementById("minutes").textContent = String(m).padStart(2, "0");
      document.getElementById("seconds").textContent = String(s).padStart(2, "0");
    }

    function changeTime(unit, delta) {
      if (running) return;
      if (unit === 'hours')   h = Math.max(0,  Math.min(99, h + delta));
      if (unit === 'minutes') m = Math.max(0,  Math.min(59, m + delta));
      if (unit === 'seconds') s = Math.max(0,  Math.min(59, s + delta));
      updateDisplay();
    }

    function tick() {
      let total = h * 3600 + m * 60 + s;
      if (total <= 0) {
        clearInterval(countdown);
        countdown = null;
        running = false;
        document.getElementById("toggle").textContent = "START";
        return;
      }
      total--;
      h = Math.floor(total / 3600);
      m = Math.floor((total % 3600) / 60);
      s = total % 60;
      updateDisplay();
    }

    function resetTimer() {
      clearInterval(countdown);
      countdown = null;
      running = false;
      h = 0; m = 0; s = 0;
      updateDisplay();
      document.getElementById("toggle").textContent = "START";
    }

    function addOneMinute() {
      m = Math.min(59, m + 1);
      // If already at 59, carry into hours
      if (running) {
        let total = h * 3600 + m * 60 + s + 60;
        h = Math.floor(total / 3600);
        m = Math.floor((total % 3600) / 60);
        s = total % 60;
      }
      updateDisplay();
    }

    document.getElementById("toggle").addEventListener("click", function () {
      if (!running) {
        if (h * 3600 + m * 60 + s <= 0) return;
        countdown = setInterval(tick, 1000);
        running = true;
        this.textContent = "STOPP";
      } else {
        clearInterval(countdown);
        countdown = null;
        running = false;
        this.textContent = "START";
      }
    });

    updateDisplay();
  </script>

  <!-- ── Clock JS ─────────────────────────────────────── -->

  <script>
    const WEEKDAYS = ["SONNTAG","MONTAG","DIENSTAG","MITTWOCH","DONNERSTAG","FREITAG","SAMSTAG"];

    function updateClock() {
      const now = new Date();
      document.getElementById("clockTimeMain").textContent =
        String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
      document.getElementById("clockTimeSeconds").textContent =
        String(now.getSeconds()).padStart(2,"0");
    }

    function updateDate() {
      const now = new Date();
      const day   = String(now.getDate()).padStart(2,"0");
      const month = String(now.getMonth() + 1).padStart(2,"0");
      document.getElementById("Datum").textContent =
        WEEKDAYS[now.getDay()] + ", " + day + "/" + month + "/" + now.getFullYear();
    }

    setInterval(updateClock, 1000);
    updateClock();
    updateDate();
  </script>
